name: Deploy backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_BACKEND }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not set — skipping source map upload."
            exit 0
          fi
          npx @sentry/cli sourcemaps inject ./dist
          npx @sentry/cli sourcemaps upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" ./dist

      - run: npm prune --omit=dev

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          RELEASE: ${{ github.sha }}
          APP_DIR: /home/learningcoach/apps/learningcoachbackend
        run: |
          SSH="ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          $SSH "mkdir -p $APP_DIR/releases/$RELEASE"
          # supabase/migrations is included so db/migrate.ts (next step) has
          # the .sql files to read — it was missing here before, which is why
          # migrations only ever ran from someone's local checkout by hand.
          rsync -az -e "ssh -i ~/.ssh/deploy_key" dist package.json package-lock.json node_modules supabase "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$APP_DIR/releases/$RELEASE/"

      - name: Run database migrations
        # Deliberately before activation: db/migrate.ts (see that file — it
        # tracks applied files in public.schema_migrations, skips ones already
        # run, wraps each in its own transaction) runs against the *new*
        # release's code, but nothing is switched over or restarted yet — a
        # failing migration just fails the deploy here, and the currently
        # running (old) release is untouched, no rollback needed.
        #
        # This step is the fix for a real recurring incident class: this repo
        # had several migration files that sat applied-in-the-repo but never
        # applied-in-production for days (skills, certificates revocation,
        # the pgcrypto fix), each causing its own wave of Sentry errors,
        # because nothing in this pipeline ever actually ran them before now.
        #
        # --env-file (Node 20.6+) reads the same EnvironmentFile systemd uses
        # for the running service (see learningcoachbackend.service), so this
        # connects with the exact same DATABASE_URL — no shell re-quoting of
        # secrets that may contain characters like $ or spaces.
        env:
          RELEASE: ${{ github.sha }}
          APP_DIR: /home/learningcoach/apps/learningcoachbackend
        run: |
          SSH="ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          $SSH "cd $APP_DIR/releases/$RELEASE && node --env-file=$APP_DIR/shared/.env dist/db/migrate.js"

      - name: Activate release, health-check, and roll back on failure
        env:
          RELEASE: ${{ github.sha }}
          APP_DIR: /home/learningcoach/apps/learningcoachbackend
          SERVICE: learningcoachbackend.service
        run: |
          SSH="ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"

          PREVIOUS=$($SSH "readlink $APP_DIR/current || true")
          echo "Previous release: ${PREVIOUS:-none}"

          $SSH "ln -sfn $APP_DIR/releases/$RELEASE $APP_DIR/current && systemctl --user restart $SERVICE"

          HEALTHY=""
          for i in $(seq 1 15); do
            sleep 2
            if $SSH "systemctl --user is-active --quiet $SERVICE"; then
              HEALTHY="1"
              break
            fi
          done

          if [ -z "$HEALTHY" ]; then
            echo "::error::$SERVICE did not become active after deploying $RELEASE — rolling back"
            $SSH "systemctl --user status $SERVICE --no-pager -l || true"
            $SSH "tail -n 100 $APP_DIR/shared/logs/current.log || true"

            if [ -n "$PREVIOUS" ]; then
              echo "Rolling back to $PREVIOUS"
              $SSH "ln -sfn $PREVIOUS $APP_DIR/current && systemctl --user restart $SERVICE"
            fi
            exit 1
          fi

          echo "$SERVICE is active on release $RELEASE"
          $SSH "ls -1dt $APP_DIR/releases/*/ | tail -n +6 | xargs -r rm -rf"
